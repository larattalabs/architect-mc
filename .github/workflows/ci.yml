name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Kit tests
        run: node --test kit/test/*.test.mjs
      - name: Mod jar without the sidecar bundle (dev marks; a release publish fails)
        working-directory: mod
        run: |
          ./gradlew --no-daemon jar
          j=build/libs/architect_mc-$(grep '^mod_version=' gradle.properties | cut -d= -f2)+nosidecar.jar
          unzip -p "$j" META-INF/MANIFEST.MF | grep -q 'Architect-Sidecar-Bundle: missing'
          unzip -p "$j" fabric.mod.json | grep -q '"architect_mc:bundle":"missing"'
          if ./gradlew --no-daemon publishToMavenLocal -Prelease -Dmaven.repo.local="$RUNNER_TEMP/m2"; then
            echo "publishToMavenLocal -Prelease without the sidecar bundle must fail"; exit 1
          fi
          rm -f "$j"
      - name: Sidecar check and bundle
        working-directory: sidecar
        run: |
          npm ci
          npm run check
          npm run build
      - name: Mod build and tests
        working-directory: mod
        run: ./gradlew --no-daemon build
