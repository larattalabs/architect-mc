plugins {
	// Minecraft 26.x is unobfuscated: the non-remapping Loom plugin is used (no mappings, no remapJar).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// docs/CONTRACT.md phase 5b F1: a jar without the sidecar bundle is a dev jar, marked three ways (the `+nosidecar` version,
// the manifest attribute Architect-Sidecar-Bundle: missing, fabric.mod.json's custom architect_mc:bundle = "missing"); release
// builds (-Prelease) and every publish task fail without it (-PallowNoSidecar lets publishToMavenLocal publish the +nosidecar
// version, for API-only compiling).
def sidecarMain = file("../sidecar/dist/main.mjs")
def sidecarLock = file("../sidecar/package-lock.json")
def sidecarBundled = sidecarMain.isFile() && sidecarMain.length() > 0 && sidecarLock.isFile()
version = sidecarBundled ? project.mod_version : project.mod_version + "+nosidecar"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// lab-ui from GitHub Packages, unless settings.gradle included a lab-ui checkout (see there). GitHub Packages needs a
	// token even for public packages: gpr.user/gpr.key (gradle properties) or GITHUB_ACTOR/GITHUB_TOKEN (CI: packages: read).
	maven {
		name = "LabUi"
		url = uri("https://maven.pkg.github.com/larattalabs/lab-ui")
		credentials {
			username = providers.gradleProperty("gpr.user").orElse(providers.environmentVariable("GITHUB_ACTOR")).getOrElse("")
			password = providers.gradleProperty("gpr.key").orElse(providers.environmentVariable("GITHUB_TOKEN")).getOrElse("")
		}
		content { includeGroup "dev.larattalabs" }
	}
}

// An actionable message when lab-ui can't be resolved (no checkout and no GitHub Packages token)
if (gradle.ext.has("labUiSource")) {
	logger.info("lab-ui: " + gradle.ext.labUiSource)
	// A composite build hands compile classpaths lab-ui's main classes directory only; its jar also has the client classes
	// (split source sets), as the published jar does. So compile against the jar.
	afterEvaluate {
		configurations.matching { it.name.endsWith("ompileClasspath") }.configureEach {
			attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
		}
	}
} else if (!providers.gradleProperty("gpr.key").isPresent() && !providers.environmentVariable("GITHUB_TOKEN").isPresent()) {
	logger.warn("lab-ui: no lab-ui checkout in use (../lab-ui or -PlabUiPath) and no GitHub Packages token. If dev.larattalabs:lab_ui:" + project.lab_ui_version
		+ " is not in the Gradle cache the build fails: clone https://github.com/larattalabs/lab-ui next to this repo (or pass"
		+ " -PlabUiPath=<dir>), or set gpr.user/gpr.key in ~/.gradle/gradle.properties (a classic token with read:packages;"
		+ " `gh auth token` works) or GITHUB_ACTOR/GITHUB_TOKEN. See README \"Development\".")
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"architect_mc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Dev run: offline player named after you (ARCHITECT_PLAYER, else the OS user name), 1080p window.
			// World auto-load/creation and mute are handled by the mod itself in dev runs (mod/DEV.md).
			def player = (System.getenv("ARCHITECT_PLAYER") ?: System.getProperty("user.name") ?: "Player").replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player, "--width", "1920", "--height", "1080"
			// ARCHITECT_XMX caps the dev client's heap (phase 6a's memory bar runs mega_bench under baseline + 2 GB)
			vmArgs "-Xmx" + providers.environmentVariable("ARCHITECT_XMX").getOrElse("4G"), "--enable-native-access=ALL-UNNAMED"
			runDir "run"
		}
		server {
			runDir "run/server"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WebSocket (DevBridge server, sidecar client). slf4j-api comes with Minecraft, so only the websocket
	// jar itself is nested (jar-in-jar).
	clientImplementation("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		exclude group: 'org.slf4j'
	}
	include("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		exclude group: 'org.slf4j'
	}

	// lab-ui, the shared client UI library (kit sprites, panels, style tokens, crash guard), jar-in-jar. Minecraft 26.x is
	// unobfuscated, so this Loom has no mod* configurations: plain implementation + include.
	implementation "dev.larattalabs:lab_ui:${project.lab_ui_version}"
	include "dev.larattalabs:lab_ui:${project.lab_ui_version}"

	// Unit tests (src/test/java) for pure logic: placement math, design spec, launcher plan.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// The kit's palettes for the Variants dialog (tools/gen-palettes.mjs -> assets/architect_mc/palettes.json). Needs node;
// without it (or if the kit fails to load) the jar has no palettes.json and the mod uses its built-in list
// (dev.larattalabs.architect.library.Palettes.FALLBACK), so the build stays green offline and node-less.
abstract class GenPalettes extends DefaultTask {
	@InputDirectory @PathSensitive(PathSensitivity.RELATIVE) @Optional
	abstract DirectoryProperty getKitLib()

	@InputFile @PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getScript()

	@OutputDirectory
	abstract DirectoryProperty getOutDir()

	@TaskAction
	void run() {
		File out = outDir.get().file("assets/architect_mc/palettes.json").asFile
		out.delete()
		if (!kitLib.isPresent() || !kitLib.get().asFile.isDirectory()) {
			logger.warn("gen-palettes: no kit/lib; the mod uses its built-in palette list")
			return
		}
		File kit = kitLib.get().asFile.parentFile
		try {
			Process p = new ProcessBuilder("node", script.get().asFile.absolutePath, "--kit", kit.absolutePath, "--out", out.absolutePath)
				.redirectErrorStream(true).start()
			String log = p.inputStream.text
			if (p.waitFor() != 0) {
				out.delete()
				logger.warn("gen-palettes failed (the mod uses its built-in palette list):\n" + log)
			} else {
				logger.info(log.trim())
			}
		} catch (IOException e) {
			logger.warn("gen-palettes: node not found (" + e.message + "); the mod uses its built-in palette list")
		}
	}
}

def genPalettes = tasks.register("genPalettes", GenPalettes) {
	def lib = file("../kit/lib")
	if (lib.isDirectory()) {
		kitLib.set(lib)
	}
	script.set(file("../tools/gen-palettes.mjs"))
	outDir.set(layout.buildDirectory.dir("generated/palettes"))
}

// The sidecar bundle check (phase 5b F1). It fails a release build (-Prelease) and every publish task without the bundle
// (publishToMavenLocal passes with -PallowNoSidecar); a plain local build only warns and gets the dev marks. With the bundle it
// writes architect-sidecar/BUNDLE.json {sidecarVersion, modVersion, builtAt, mainSha256} into the jar.
abstract class CheckSidecarBundle extends DefaultTask {
	@Input abstract Property<Boolean> getBundled()
	@Input abstract Property<Boolean> getRelease()
	@Input abstract ListProperty<String> getPublishTasks()
	@Input abstract Property<Boolean> getAllowNoSidecar()
	@Input abstract Property<String> getModVersion()
	@Internal abstract RegularFileProperty getMainFile()
	@Internal abstract RegularFileProperty getPackageFile()
	@OutputDirectory abstract DirectoryProperty getOutDir()

	@TaskAction
	void run() {
		File out = outDir.get().file("architect-sidecar/BUNDLE.json").asFile
		out.delete()
		String fix = "release builds need the sidecar bundle: cd sidecar && npm ci && npm run build"
		if (!bundled.get()) {
			if (release.get()) {
				throw new GradleException(fix + " (-Prelease)")
			}
			List<String> pub = publishTasks.get()
			boolean onlyLocal = !pub.isEmpty() && pub.every { it.toLowerCase().endsWith("publishtomavenlocal") }
			if (!pub.isEmpty() && !(onlyLocal && allowNoSidecar.get())) {
				throw new GradleException(fix + " (" + String.join(", ", pub) + "; -PallowNoSidecar lets publishToMavenLocal publish the +nosidecar version)")
			}
			logger.warn("WARNING: no sidecar bundle (sidecar/dist/main.mjs): this is a development jar " + modVersion.get()
				+ " that ships no sidecar. Set ARCHITECT_SIDECAR_DIR when running it, or build sidecar/ and rebuild.")
			return
		}
		File main = mainFile.get().asFile
		String sha = java.security.MessageDigest.getInstance("SHA-256").digest(main.bytes).encodeHex().toString()
		def pkg = new groovy.json.JsonSlurper().parse(packageFile.get().asFile)
		out.parentFile.mkdirs()
		out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([sidecarVersion: pkg.version, modVersion: modVersion.get(),
			builtAt: java.time.Instant.now().toString(), mainSha256: sha])) + "\n"
	}
}

def checkSidecarBundle = tasks.register("checkSidecarBundle", CheckSidecarBundle) {
	bundled.set(sidecarBundled)
	release.set(project.hasProperty("release"))
	publishTasks.set(gradle.startParameter.taskNames.findAll { it.toLowerCase().contains("publish") })
	allowNoSidecar.set(project.hasProperty("allowNoSidecar"))
	modVersion.set(project.version.toString())
	mainFile.set(sidecarMain)
	packageFile.set(file("../sidecar/package.json"))
	outDir.set(layout.buildDirectory.dir("generated/sidecarBundle"))
	// the bundle's content is an input when it exists (BUNDLE.json's hash follows it)
	if (sidecarBundled) {
		inputs.file(sidecarMain)
	}
}

// every publish task checks the bundle, also one that publishes nothing (`publish` without a repository)
tasks.matching { it.name.startsWith("publish") }.configureEach {
	dependsOn(checkSidecarBundle)
}

jar {
	manifest {
		attributes("Architect-Sidecar-Bundle": sidecarBundled ? "present" : "missing")
	}
}

processResources {
	from(genPalettes)
	from(checkSidecarBundle)
	def version = project.version
	def bundle = sidecarBundled ? "present" : "missing"
	inputs.property "version", version
	inputs.property "bundle", bundle

	filesMatching("fabric.mod.json") {
		expand "version": version, "bundle": bundle
	}

	// The sidecar bundle (docs/CONTRACT.md "Launcher"): the built sidecar and the blueprint kit, copied into the
	// jar's architect-sidecar/ when they exist. Missing source dirs are simply empty, so the mod builds without
	// them (the launcher then reports "no sidecar bundled").
	from("../sidecar/dist") {
		into "architect-sidecar/dist"
	}
	from("../sidecar") {
		include "package.json", "package-lock.json"
		into "architect-sidecar"
	}
	// the kit's hand-written examples are the bundled library (data/architect_mc/library/<id>/, the library layout)
	from("../kit/examples") {
		exclude "**/.DS_Store"
		into "data/architect_mc/library"
	}
	from("../kit") {
		exclude "node_modules/**", "out/**", "**/.DS_Store"
		into "architect-sidecar/kit"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// docs/CONTRACT.md "Versioning": `./gradlew publishToMavenLocal` publishes dev.larattalabs:architect_mc:<version>, the mod
// jar plus a sources jar. The package dev.larattalabs.architect.api is the contract; everything else is internal.
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'dev.larattalabs'
			artifactId = 'architect_mc'
			from components.java
		}
	}
	// CI on release tags (.github/workflows/publish.yml): GitHub Packages, only when the workflow's token is there
	if (System.getenv("GITHUB_TOKEN")) {
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri('https://maven.pkg.github.com/larattalabs/architect-mc')
				credentials {
					username = System.getenv('GITHUB_ACTOR')
					password = System.getenv('GITHUB_TOKEN')
				}
			}
		}
	}
}

// The dev-only API test mod (../apitest) joins the dev client's classpath only when asked for (ARCHITECT_APITEST=1 or
// -Papitest). It is never a dependency of the published jar and never in the sidecar bundle.
if (System.getenv("ARCHITECT_APITEST") == "1" || project.hasProperty("apitest")) {
	loom {
		mods {
			"architect_apitest" {
				sourceSet("main", ":apitest")
				sourceSet("client", ":apitest")
			}
		}
	}
	dependencies {
		localRuntime(project(":apitest")) {
			transitive = false
		}
	}
}

// Seed mod/run with a dev options.txt (muted, 1080p GUI scale, no onboarding noise, no pause on focus
// loss). Only copied when mod/run/options.txt does not exist yet. Delete mod/run/options.txt to reset.
def runOptionsFile = file("run/options.txt")
def prepareRunDir = tasks.register("prepareRunDir", Copy) {
	from("run-template")
	into("run")
	onlyIf("options.txt not present yet") { !runOptionsFile.exists() }
}

tasks.matching { it.name == "runClient" }.configureEach {
	dependsOn(prepareRunDir)
}

// Unpack the decompiled Minecraft sources into build/mcsrc (`gradlew mcSources`, then grep build/mcsrc/net/minecraft/...).
tasks.register("mcSources", Sync) {
	group = "architect"
	description = "Decompile (genSources) and unpack Minecraft sources into build/mcsrc"
	dependsOn("genSources")
	notCompatibleWithConfigurationCache("reads Loom's cache directory at execution time")
	def loomCache = file(".gradle/loom-cache/minecraftMaven")
	from {
		fileTree(loomCache) { include "**/*-sources.jar" }.files.collect { zipTree(it) }
	}
	into(layout.buildDirectory.dir("mcsrc"))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
