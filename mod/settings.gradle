pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'architect_mc'

// dev-only API test mod (docs/CONTRACT.md "Phase 4a gate"); never in the shipped jar
include ':apitest'
project(':apitest').projectDir = file('../apitest')

// lab-ui (dev.larattalabs:lab_ui, the shared client UI library), resolved in this order:
//  1. a lab-ui checkout as a composite build: -PlabUiPath=<dir> (gradle property), else ../lab-ui next to this repo
//     (../../lab-ui from mod/) when it exists. Its dev.larattalabs:lab_ui replaces the published one.
//  2. GitHub Packages (mod/build.gradle), which needs a token even for public packages: gpr.user/gpr.key in
//     ~/.gradle/gradle.properties (or $GRADLE_USER_HOME/gradle.properties), or GITHUB_ACTOR/GITHUB_TOKEN in the environment.
// -PlabUiPath=maven skips the checkout and uses GitHub Packages.
def labUiPathProp = providers.gradleProperty('labUiPath').orNull
def labUiDir = labUiPathProp == null ? file('../../lab-ui') : (labUiPathProp == 'maven' ? null : file(labUiPathProp))
if (labUiDir != null) {
	if (new File(labUiDir, 'settings.gradle').isFile()) {
		includeBuild(labUiDir)
		gradle.ext.labUiSource = 'checkout ' + labUiDir.canonicalPath
	} else if (labUiPathProp != null) {
		throw new GradleException("labUiPath=" + labUiPathProp + " is not a lab-ui checkout (no settings.gradle in " + labUiDir.canonicalPath + ")")
	}
}
